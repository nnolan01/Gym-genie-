workflows:
  gymgenie-ios:
    name: GymGenie iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.yourcompany.gymgenie"
    cache:
      cache_paths:
        - ~/Library/Developer/Xcode/DerivedData
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$BUNDLE_ID.GymGenieShare" --type IOS_APP_EXTENSION --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build archive
        script: |
          xcodebuild -project "GymGenie.xcodeproj" \
            -scheme GymGenie \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            archive -archivePath "$CM_BUILD_DIR/GymGenie.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=YOUR_TEAM_ID
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/GymGenie.xcarchive" \
            -exportPath "$CM_BUILD_DIR/ipa" \
            -exportOptionsPlist /dev/stdin \
            <<< '<?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>method</key><string>app-store</string>
              <key>teamID</key><string>YOUR_TEAM_ID</string>
              <key>uploadSymbols</key><true/>
              <key>uploadBitcode</key><false/>
            </dict>
            </plist>'
    artifacts:
      - "$CM_BUILD_DIR/ipa/*.ipa"
      - "$CM_BUILD_DIR/GymGenie.xcarchive"
    
